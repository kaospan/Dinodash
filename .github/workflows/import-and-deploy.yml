name: Import Phoneage, Rebrand and Deploy Dinodash

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dinodash-pages
  cancel-in-progress: true

jobs:
  build-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dinodash
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Phoneage source
        run: |
          if [ -f .dinodash-imported ] && [ -f package.json ]; then
            echo "Phoneage source already imported."
          else
            git clone --depth 1 https://github.com/kaospan/phoneage.git /tmp/phoneage
            find /tmp/phoneage -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} . \;
            touch .dinodash-imported
          fi

      - name: Rebrand source text
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          skip = {'.git', 'node_modules', 'dist', '.github'}
          exts = {'.ts','.tsx','.js','.jsx','.json','.md','.html','.css','.scss','.svg','.txt','.yml','.yaml'}
          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts) or p.suffix.lower() not in exts:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              n = s.replace('Phoneage', 'Dinodash').replace('PHONEAGE', 'DINODASH').replace('phoneage', 'dinodash')
              if n != s:
                  p.write_text(n, encoding='utf-8')
          PY

      - name: Commit imported Dinodash source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import and rebrand Phoneage as Dinodash" || echo "No source changes to commit"
          git push origin main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Dinodash
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build-and-import
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
