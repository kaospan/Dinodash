name: Sync phoneagev3 reference architecture
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync proven phoneagev3 gameplay architecture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phoneagev3
          git clone --depth 1 https://github.com/kaospan/phoneagev3.git /tmp/phoneagev3
          files=(
            src/components/PuzzleGame.tsx
            src/components/GameFPS.tsx
            src/components/ViewModeSwitcher.tsx
            src/components/CampaignDialog.tsx
            src/shell/GameHudTop.tsx
            src/hooks/useGameEngine.ts
            src/hooks/useGameControls.ts
            src/hooks/useCameraGestures.ts
            src/hooks/useGameTimerSession.ts
          )
          for f in "${files[@]}"; do
            test -f "/tmp/phoneagev3/$f"
            mkdir -p "$(dirname "$f")"
            cp "/tmp/phoneagev3/$f" "$f"
          done
          node <<'NODE'
          const fs = require('fs');
          const target = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const source = JSON.parse(fs.readFileSync('/tmp/phoneagev3/package.json', 'utf8'));
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            target[section] ??= {};
            for (const [name, version] of Object.entries(source[section] ?? {})) {
              if (!(name in target[section])) target[section][name] = version;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(target, null, 2) + '\n');
          NODE
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/hooks/useCameraGestures.ts';
          let s = fs.readFileSync(path, 'utf8');
          const state = `const [cameraZoomIndex, setCameraZoomIndex] = useState(() => {\n    try {\n      const stored = Number.parseInt(localStorage.getItem("dinodash-camera-zoom-index") ?? "", 10);\n      if (Number.isInteger(stored) && stored >= 0 && stored < CAMERA_ZOOM_LEVELS.length) return stored;\n    } catch {}\n    return isMobile ? MOBILE_DEFAULT_CAMERA_ZOOM_INDEX : DEFAULT_CAMERA_ZOOM_INDEX;\n  });`;
          const original = `const [cameraZoomIndex, setCameraZoomIndex] = useState(() =>\n    isMobile ? MOBILE_DEFAULT_CAMERA_ZOOM_INDEX : DEFAULT_CAMERA_ZOOM_INDEX\n  );`;
          if (!s.includes(state)) {
            if (!s.includes(original)) throw new Error('camera zoom state initializer not found');
            s = s.replace(original, state);
          }
          const marker = `  const [userZoomTouched, setUserZoomTouched] = useState(false);`;
          const persistence = `  useEffect(() => {\n    try {\n      localStorage.setItem("dinodash-camera-zoom-index", String(cameraZoomIndex));\n    } catch {}\n  }, [cameraZoomIndex]);\n\n`;
          if (!s.includes(persistence)) {
            if (!s.includes(marker)) throw new Error('camera zoom state marker not found');
            s = s.replace(marker, persistence + marker);
          }
          fs.writeFileSync(path, s);
          NODE
          npm install
          npm test -- --run
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/PuzzleGame.tsx src/components/GameFPS.tsx src/components/ViewModeSwitcher.tsx src/components/CampaignDialog.tsx src/shell/GameHudTop.tsx src/hooks/useGameEngine.ts src/hooks/useGameControls.ts src/hooks/useCameraGestures.ts src/hooks/useGameTimerSession.ts package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'sync Dinodash gameplay architecture from phoneagev3'
          git push