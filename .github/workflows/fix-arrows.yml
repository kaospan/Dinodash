name: Fix DinoDash arrows
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'fix: restore Game3D and align arrow visuals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Game3D and flip single-arrow visuals
        shell: bash
        run: |
          set -euo pipefail
          git checkout 383742db1d0acdcc9687867324d5b81301398322 -- src/components/Game3D.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/Game3D.tsx')
          s = p.read_text()
          old = '''  const rotations: { [key: number]: number } = {
    7: 0,           // up
    8: -Math.PI / 2, // right - points in +X direction
    9: Math.PI,     // down
    10: Math.PI / 2 // left - points in -X direction
  };'''
          new = '''  const rotations: { [key: number]: number } = {
    7: Math.PI,       // down
    8: Math.PI / 2,   // left - points in -X direction
    9: 0,              // up
    10: -Math.PI / 2  // right - points in +X direction
  };'''
          if old not in s:
              raise SystemExit('single-arrow rotation block not found')
          p.write_text(s.replace(old, new))
          PY
          npm install
          npm test -- --run
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Game3D.tsx
          git commit -m 'fix: restore Game3D and align arrow visuals'
          git push
