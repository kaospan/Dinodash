name: Restore DinoDash Game3D
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'restore Game3D')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore authoritative Game3D renderer
        shell: bash
        run: |
          set -euo pipefail
          git checkout 383742db1d0acdcc9687867324d5b81301398322 -- src/components/Game3D.tsx
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/Game3D.tsx')
          s = p.read_text()
          replacements = {
              '7: 0,           // up': '7: Math.PI,       // down',
              '8: -Math.PI / 2, // right - points in +X direction': '8: Math.PI / 2,   // left - points in -X direction',
              '9: Math.PI,     // down': '9: 0,              // up',
              '10: Math.PI / 2 // left - points in -X direction': '10: -Math.PI / 2  // right - points in +X direction',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          if not s.strip():
              raise SystemExit('Game3D restoration produced an empty file')
          p.write_text(s)
          PY
          test -s src/components/Game3D.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Game3D.tsx
          if git diff --cached --quiet; then
            echo 'Game3D already restored.'
            exit 0
          fi
          git commit -m 'restore Game3D authoritative renderer'
          git push
