name: Restore DinoDash Game3D
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and flip arrows
        shell: bash
        run: |
          set -euo pipefail
          git checkout 383742db1d0acdcc9687867324d5b81301398322 -- src/components/Game3D.tsx
          sed -i 's/7: 0,           \/\/ up/7: Math.PI,       \/\/ down/' src/components/Game3D.tsx
          sed -i 's/8: -Math.PI \/ 2, \/\/ right - points in +X direction/8: Math.PI \/ 2,   \/\/ left - points in -X direction/' src/components/Game3D.tsx
          sed -i 's/9: Math.PI,     \/\/ down/9: 0,              \/\/ up/' src/components/Game3D.tsx
          sed -i 's/10: Math.PI \/ 2 \/\/ left - points in -X direction/10: -Math.PI \/ 2  \/\/ right - points in +X direction/' src/components/Game3D.tsx
          npm install
          npm test -- --run
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Game3D.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Dino arrow visuals and restore Game3D'
          git push
