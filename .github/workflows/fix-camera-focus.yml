name: Fix Dino camera focus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Game3D and align arrow visuals
        shell: bash
        run: |
          set -euo pipefail
          git checkout 383742db1d0acdcc9687867324d5b81301398322 -- src/components/Game3D.tsx
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/components/Game3D.tsx")
          text = path.read_text()
          old = """  const rotations: { [key: number]: number } = {
    7: 0,           // up
    8: -Math.PI / 2, // right - points in +X direction
    9: Math.PI,     // down
    10: Math.PI / 2 // left - points in -X direction
  };"""
          new = """  const rotations: { [key: number]: number } = {
    7: Math.PI,       // down
    8: Math.PI / 2,   // left - points in -X direction
    9: 0,              // up
    10: -Math.PI / 2  // right - points in +X direction
  };"""
          if old not in text:
              raise SystemExit("single-arrow rotation block not found")
          path.write_text(text.replace(old, new))
          PY

      - name: Patch camera target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/components/Dinodash3D.tsx')
          text = path.read_text()
          if '/* DINO_CAMERA_FOLLOW */' in text:
              print('Camera follow patch already present.')
              raise SystemExit(0)
          replacement = '''/* DINO_CAMERA_FOLLOW */
          function Camera({level,player,topDown}:{level:Level3D;player:Position3D;topDown:boolean}){
            const {size}=useThree();
            const controls=useRef<any>(null);
            const center=useMemo(()=>new THREE.Vector3((level.width-1)*S/2,0,(level.depth-1)*S/2),[level]);
            const target=useMemo(()=>new THREE.Vector3(player.x*S,.4,player.y*S),[player]);
            const fov=42*Math.PI/180;
            const fit=Math.max(level.width*S/(2*Math.tan(fov/2)*Math.max(.5,size.width/Math.max(1,size.height))),level.depth*S/(2*Math.tan(fov/2)))*1.2;
            const dist=Math.max(5,fit);
            const iso=useMemo(()=>new THREE.Vector3(.75,.9,.75).normalize(),[]);
            useFrame((_,dt)=>{
              if(!controls.current)return;
              const t=topDown?center:target;
              controls.current.target.lerp(t,Math.min(1,dt*8));
              if(!topDown){
                const offset=controls.current.object.position.clone().sub(controls.current.target);
                const distance=offset.length();
                if(distance>0){
                  const desired=target.clone().add(offset.normalize().multiplyScalar(distance));
                  controls.current.object.position.lerp(desired,Math.min(1,dt*8));
                }
              }
              controls.current.update();
            });
            const cameraPosition=target.clone().add(iso.clone().multiplyScalar(dist));
            return <><PerspectiveCamera makeDefault position={topDown?[center.x,dist*1.15,center.z+.01]:cameraPosition.toArray()} fov={42}/><OrbitControls ref={controls} target={topDown?center:target} enablePan={false} enableRotate enableDamping dampingFactor={.08} minPolarAngle={.08} maxPolarAngle={Math.PI/2-.035} minDistance={Math.max(2.5,dist*.35)} maxDistance={dist}/></>;
          }
          '''
          pattern = r'function Camera\(\{level,player,topDown\}:\{level:Level3D;player:Position3D;topDown:boolean\}\).*?(?=function ArrowPlatform)'
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              print('Camera function shape differs; no camera change made.')
              raise SystemExit(0)
          path.write_text(new_text)
          PY

      - name: Validate build
        shell: bash
        run: |
          npm install
          npm test -- --run
          npm run build

      - name: Commit camera and arrow fixes
        shell: bash
        run: |
          if git diff --quiet -- src/components/Dinodash3D.tsx src/components/Game3D.tsx; then
            echo "No camera or arrow change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dinodash3D.tsx src/components/Game3D.tsx
          git commit -m "Fix Dino camera and arrow direction"
          git push
