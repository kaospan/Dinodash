name: Fix Dino camera focus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Game3D and flip single-arrow visuals
        shell: bash
        run: |
          set -euo pipefail
          git checkout 383742db1d0acdcc9687867324d5b81301398322 -- src/components/Game3D.tsx
          python3 -c 'from pathlib import Path; p=Path("src/components/Game3D.tsx"); s=p.read_text(); s=s.replace("7: 0,           // up", "7: Math.PI,       // down"); s=s.replace("8: -Math.PI / 2, // right - points in +X direction", "8: Math.PI / 2,   // left - points in -X direction"); s=s.replace("9: Math.PI,     // down", "9: 0,              // up"); s=s.replace("10: Math.PI / 2 // left - points in -X direction", "10: -Math.PI / 2  // right - points in +X direction"); p.write_text(s)'

      - name: Validate build
        shell: bash
        run: |
          npm install
          npm test -- --run
          npm run build

      - name: Commit arrow fix
        shell: bash
        run: |
          if git diff --quiet -- src/components/Game3D.tsx; then
            echo "No Game3D arrow change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Game3D.tsx
          git commit -m "Fix Dino arrow direction"
          git push
