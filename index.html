<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="build-id" content="%VITE_BUILD_ID%" />
    <title>Dinodash</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="description" content="A mobile puzzle game" />
    <meta property="og:title" content="Dinodash" />
    <meta property="og:description" content="A mobile puzzle game" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get("redirect");
        const isSafeRelativePath = redirect
          && redirect.startsWith("/")
          && !redirect.startsWith("//")
          && !redirect.startsWith("/\\");
        if (isSafeRelativePath) {
          params.delete("redirect");
          const newSearch = params.toString();
          const search = newSearch ? `?${newSearch}` : "";
          window.history.replaceState(null, "", redirect + search + window.location.hash);
        }
      })();
    </script>
    <script type="module" src="%BASE_URL%src/main.tsx"></script>
  </body>
</html>
